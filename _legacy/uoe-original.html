<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Use of English – C1 trénink</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#16213A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF0F4; --sheet:#FBFCFD; --ink:#16213A; --muted:#566077; --rule:#C8D0DC;
  --soft:#E3E8EF; --red:#C4262D; --green:#1B7A4C; --hl:#FFF0A6;
  --accent:#16213A; --accent-ink:#FBFCFD;
  --serif:"Newsreader", Georgia, "Times New Roman", serif;
  --sans:"Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --hand:"Caveat", "Segoe Script", "Bradley Hand", "Comic Sans MS", cursive;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1320; --sheet:#171E2F; --ink:#E8EDF7; --muted:#9AA5BB; --rule:#2B3550;
    --soft:#202A40; --red:#FF7A7A; --green:#62D39C; --hl:#4B4521;
    --accent:#E8EDF7; --accent-ink:#0E1320;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1320; --sheet:#171E2F; --ink:#E8EDF7; --muted:#9AA5BB; --rule:#2B3550;
  --soft:#202A40; --red:#FF7A7A; --green:#62D39C; --hl:#4B4521;
  --accent:#E8EDF7; --accent-ink:#0E1320;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
main{max-width:680px;margin:0 auto;padding:22px 18px 56px}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(34px,8vw,46px);line-height:1.05;letter-spacing:-0.02em;margin:6px 0 4px}
.sub{margin:0 0 18px;color:var(--muted);font-size:15px}
nav{display:flex;gap:26px;border-bottom:1px solid var(--rule);margin-bottom:20px}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 0 9px;margin-bottom:-1px;font:inherit;font-weight:500;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
button{font-family:inherit}
:focus-visible{outline:3px solid #4C8DFF;outline-offset:2px;border-radius:4px}

.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:20px 22px 22px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-size:14px;margin-bottom:10px}
.bar{height:3px;background:var(--soft);border-radius:2px;margin:0 0 18px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ink);transition:width .3s}
.again{background:var(--hl);color:var(--ink);padding:1px 9px;border-radius:10px;font-size:13px;font-weight:500}

.orig{font-family:var(--serif);font-size:19px;line-height:1.55;margin:0 0 14px;color:var(--ink)}
.keyrow{display:flex;align-items:center;gap:12px;margin:0 0 14px;flex-wrap:wrap}
.keybox{display:inline-block;border:1.5px solid var(--ink);border-radius:3px;padding:2px 12px;font-weight:600;letter-spacing:.06em;font-size:15px;background:var(--sheet)}
.keybox.inline{margin-left:12px;vertical-align:2px}
.note{color:var(--muted);font-size:13px}
.text{font-family:var(--serif);font-size:clamp(20px,4.6vw,23px);line-height:2.15;margin:0 0 18px}
.gap-in{font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:2px solid var(--ink);border-radius:0;text-align:center;padding:0 4px;max-width:100%;min-width:6ch}
.gap-in:focus{outline:none;background:var(--hl)}
.gap-blank{display:inline-block;width:5.5ch;border-bottom:2px solid var(--ink);vertical-align:-2px}
.filled{padding:0 .2em;border-bottom:2px solid var(--ink)}
.filled.ok{border-bottom-color:var(--green);color:var(--green);font-weight:500}
.filled.ok::after{content:" ✓";font-family:var(--sans);font-size:.8em}
.filled.bad{border-bottom:0}
.filled.bad s{text-decoration-color:var(--red);text-decoration-thickness:2px;color:var(--muted)}
.pen{display:inline-block;font-family:var(--hand);font-weight:600;font-size:1.3em;line-height:1;color:var(--red);margin-left:.4em;transform:rotate(-2deg);animation:write .55s ease-out both}
@keyframes write{from{clip-path:inset(-4px 100% -4px 0)}to{clip-path:inset(-4px 0 -4px 0)}}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{appearance:none;font-size:16px;font-weight:500;min-height:44px;padding:0 20px;border-radius:6px;cursor:pointer;border:1.5px solid var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.ghost:hover{border-color:var(--ink)}
.hint{margin:12px 0 0;color:var(--muted);font-size:14px;min-height:1.2em}

.opts{display:grid;gap:8px;margin:0 0 16px}
.opt{appearance:none;display:flex;gap:12px;align-items:baseline;text-align:left;width:100%;min-height:46px;padding:10px 14px;background:transparent;color:var(--ink);border:1.5px solid var(--rule);border-radius:6px;font-family:var(--serif);font-size:19px;cursor:pointer}
.opt i{font-family:var(--sans);font-style:normal;font-size:14px;color:var(--muted);width:1ch}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--green);background:color-mix(in srgb,var(--green) 12%,transparent)}
.opt.wrong{border-color:var(--red);background:color-mix(in srgb,var(--red) 10%,transparent);text-decoration:line-through;text-decoration-color:var(--red)}

.fb{border-left:3px solid var(--green);padding:2px 0 2px 14px;margin:0 0 18px}
.fb.bad{border-left-color:var(--red)}
.fb .verdict{margin:0 0 4px;font-weight:600}
.fb .why{margin:0;font-size:15.5px}
.fb .alts{margin:6px 0 0;font-size:14px;color:var(--muted)}

.home p{margin:0 0 16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}
.chip{appearance:none;min-height:40px;padding:0 14px;border-radius:20px;border:1.5px solid var(--rule);background:transparent;color:var(--ink);font-size:15px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.plan{color:var(--muted);font-size:15px;margin:16px 0 0}

.score{font-family:var(--serif);font-size:clamp(34px,8vw,44px);line-height:1.1;margin:0 0 4px}
.errs{margin:18px 0 20px;padding:0;list-style:none;display:grid;gap:14px}
.errs li{font-family:var(--serif);font-size:18px;line-height:1.7;border-top:1px solid var(--rule);padding-top:12px}
.errs b{font-weight:600;color:var(--green)}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:0 0 22px}
.stat{border:1px solid var(--rule);border-radius:6px;padding:12px 14px;background:var(--sheet)}
.stat b{display:block;font-family:var(--serif);font-size:28px;font-weight:500;line-height:1.1}
.stat span{font-size:13.5px;color:var(--muted)}
h2{font-family:var(--serif);font-weight:500;font-size:24px;margin:26px 0 10px}
.cats{display:grid;gap:12px}
.cat .top{display:flex;justify-content:space-between;gap:10px;font-size:15px;margin-bottom:4px}
.cat .top span:last-child{color:var(--muted)}
.cat .track{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.cat .track i{display:block;height:100%;background:var(--ink);border-radius:4px}
.cat .track i.low{background:var(--red)}
.link-btn{appearance:none;background:none;border:0;padding:0;color:var(--muted);font-size:14px;text-decoration:underline;cursor:pointer}

.cheat details{border-bottom:1px solid var(--rule);padding:4px 0}
.cheat summary{cursor:pointer;font-family:var(--serif);font-size:20px;padding:12px 0;list-style:none}
.cheat summary::-webkit-details-marker{display:none}
.cheat summary::after{content:"+";float:right;color:var(--muted)}
.cheat details[open] summary::after{content:"–"}
.cheat .body{padding:0 0 14px;font-size:15.5px}
.cheat .body p{margin:0 0 10px}
.cheat .body ul{margin:0 0 10px;padding-left:20px}
.cheat .body li{margin:3px 0}
.cheat em{font-family:var(--serif);font-size:17px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main>
  <h1>Use of English</h1>
  <p class="sub" id="sub">Cambridge C1 Advanced – trénink podle toho, kde chybuješ</p>
  <nav role="tablist" aria-label="Sekce">
    <button class="tab" role="tab" data-v="train" aria-selected="true">Trénink</button>
    <button class="tab" role="tab" data-v="stats" aria-selected="false">Pokrok</button>
    <button class="tab" role="tab" data-v="cheat" aria-selected="false">Tahák</button>
  </nav>
  <div id="stage"></div>
</main>

<script>
/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const norm = s => String(s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/[.,;!?]+/g," ").replace(/\s+/g," ").trim();
const plural = n => n===1 ? "slovo" : (n>=2 && n<=4 ? "slova" : "slov");
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

/* ---------- question bank ---------- */
const CATS = {
  inv:"Inverze", ded:"Modály – dedukce", pas:"Trpný rod a have sth done", cond:"Podmínky a wish",
  link:"Spojky a protiklad", prep:"Předložky a vazby", gram:"Gramatické struktury",
  wfa:"Tvoření slov – předpony a přípony", wfc:"Tvoření slov – záměnná slova", col:"Kolokace a frázová slovesa"
};
const PARTS = {1:"Part 1 · výběr z možností", 2:"Part 2 · doplň jedno slovo", 3:"Part 3 · tvoření slov", 4:"Part 4 · přeformulování"};

const kt=(id,cat,a,key,text,ans,why)=>({id,part:4,type:"kt",cat,a,key,text,ans,why});
const oc=(id,cat,text,ans,why)=>({id,part:2,type:"oc",cat,text,ans,why});
const wf=(id,cat,text,key,ans,why)=>({id,part:3,type:"wf",cat,text,key,ans,why});
const mc=(id,cat,text,opts,correct,why)=>({id,part:1,type:"mc",cat,text,opts,correct,why});

const BANK = [
/* Part 4 */
kt("kt01","inv","I only realised I'd lost my keys when I got home.","UNTIL","Not ____ I realised I'd lost my keys.",["until I got home did","until I arrived home did","until I got back home did","until I reached home did"],"Po „Not until“ následuje inverze: Not until + okolnost + pomocné sloveso + podmět → Not until I got home did I realise."),
kt("kt02","inv","The lights went out immediately after we sat down.","SOONER","No ____ than the lights went out.",["sooner had we sat down","sooner had we sat","sooner had we taken our seats"],"No sooner + had + podmět + 3. tvar … than + minulý čas. Je to inverze, proto had před „we“."),
kt("kt03","inv","I have never been treated so rudely before.","NEVER","____ so rudely before.",["never have I been treated"],"Never na začátku věty → pomocné sloveso před podmět: Never have I been treated."),
kt("kt04","ded","Perhaps she missed the train.","MIGHT","She ____ the train.",["might have missed"],"might / may / could + have + 3. tvar = možná se to stalo v minulosti."),
kt("kt05","ded","I'm sure he didn't see me, otherwise he would have said hello.","CAN'T","He ____ me, otherwise he would have said hello.",["can't have seen"],"can't have + 3. tvar = určitě se to nestalo. Klíčové slovo se nesmí měnit, „can not“ ani „cannot“ by neprošlo."),
kt("kt06","ded","She will certainly be delighted with the news.","BOUND","She ____ delighted with the news.",["is bound to be"],"be bound to + infinitiv = určitě, nevyhnutelně."),
kt("kt07","pas","A mechanic repaired my car yesterday.","HAD","I ____ yesterday.",["had my car repaired"],"have + předmět + 3. tvar = nechat si něco udělat."),
kt("kt08","pas","It is thought that the thief entered through the window.","THOUGHT","The thief ____ entered through the window.",["is thought to have"],"Osobní trpný rod: is thought to + infinitiv. Když se děj stal dřív: to have + 3. tvar."),
kt("kt09","cond","I would have failed without your help.","HAD","____ your help, I would have failed.",["had it not been for"],"Had it not been for = if it hadn't been for. Inverze nahrazuje „if“ ve 3. kondicionálu."),
kt("kt10","cond","I regret not saving more money when I was younger.","WISH","I ____ more money when I was younger.",["wish I had saved","wish I'd saved"],"wish + had + 3. tvar = lítost nad minulostí."),
kt("kt11","gram","The exam wasn't as easy as Jana had expected.","HARDER","The exam ____ Jana had expected.",["was harder than","was much harder than","was a lot harder than","was far harder than","was even harder than"],"not as easy as = harder than. Pozor na „than“, ne „as“."),
kt("kt12","gram","He is too young to drive.","ENOUGH","He ____ drive.",["is not old enough to","isn't old enough to"],"too + přídavné jméno = not + opačné přídavné jméno + enough."),
kt("kt13","link","Although it was raining, we went out.","SPITE","We went out ____ the rain.",["in spite of"],"in spite of + podstatné jméno (nebo -ing). Pozor: in spite OF, ale despite bez „of“."),
kt("kt14","pas","They are building a new bridge.","BEING","A new bridge ____ built.",["is being"],"Průběhový trpný rod: is / are being + 3. tvar."),
kt("kt15","gram","It doesn't matter how hard you try; you won't persuade her.","MATTER","No ____ you try, you won't persuade her.",["matter how hard"],"No matter how / what / who / where = ať už jak / co / kdo / kde."),
kt("kt16","inv","He had no idea that the police were watching him.","LITTLE","____ that the police were watching him.",["little did he know","little did he realise","little did he realize","little did he suspect"],"Little na začátku věty = vůbec ne: Little + did + podmět + základní tvar."),
kt("kt17","prep","This is definitely not the best solution.","MEANS","This is ____ the best solution.",["by no means"],"by no means = v žádném případě, rozhodně ne. Ustálené spojení, v Part 2 i 4 se opakuje."),

/* Part 2 */
oc("oc01","inv","Not only ____ it distract them from schoolwork, but it can also damage their self-esteem.",["does"],"Not only na začátku věty → inverze, v přítomném čase se použije does."),
oc("oc02","inv","Rarely ____ I seen such a beautiful view.",["have"],"Rarely / seldom / never + pomocné sloveso + podmět: Rarely have I seen."),
oc("oc03","inv","Hardly had we left the house ____ it started to snow.",["when","before"],"Hardly / scarcely had … when. Po „no sooner“ ale následuje than."),
oc("oc04","inv","No sooner had I arrived ____ it started to rain.",["than"],"No sooner … than. Po „hardly“ je when."),
oc("oc05","cond","Had I known about the problem, I ____ have helped.",["would","could","might"],"Had I known = If I had known (3. kondicionál), tedy would / could / might have + 3. tvar."),
oc("oc06","cond","If it ____ not been for your help, I would have failed.",["had"],"If it had not been for = kdyby nebylo."),
oc("oc07","prep","She insisted ____ paying for the meal.",["on"],"insist on + -ing."),
oc("oc08","prep","I'm not used ____ getting up so early.",["to"],"be used to + -ing = být zvyklý. (used to + infinitiv = dřív jsem)."),
oc("oc09","prep","She apologised ____ being late.",["for"],"apologise for + -ing."),
oc("oc10","prep","I look forward ____ hearing from you soon.",["to"],"look forward to + -ing."),
oc("oc11","gram","The more you practise, ____ better you'll become.",["the"],"the + srovnávací stupeň …, the + srovnávací stupeň = čím víc …, tím víc."),
oc("oc12","gram","It was such a long journey ____ we were exhausted.",["that"],"such + (a) + podstatné jméno + that … (so + přídavné jméno + that)."),
oc("oc13","link","____ the weather was terrible, the match went ahead.",["although","though"],"Although / though + celá věta. Despite a in spite of potřebují podstatné jméno nebo -ing."),
oc("oc14","link","He loves sport, ____ his brother prefers reading.",["whereas","while","but"],"whereas / while = zatímco (protiklad dvou osob nebo věcí)."),
oc("oc15","gram","I'd rather you ____ smoke in here.",["didn't"],"would rather + podmět + minulý čas = raději bych, abys …"),
oc("oc16","inv","Not until the end of the film ____ I realise who the killer was.",["did"],"Not until … → inverze s pomocným slovesem did."),
oc("oc17","prep","She is, ____ a doubt, the best candidate for the job.",["without","beyond"],"without a doubt / beyond a doubt = bez pochyby."),
oc("oc18","cond","If I ____ you, I would accept the offer.",["were","was"],"If I were you = být na tvém místě. Ve formálním jazyce preferuj were."),

/* Part 3 */
wf("wf01","wfc","Automation has greatly improved worker ____.","PRODUCE",["productivity"],"production = výroba (what is made), productivity = výkonnost, efektivita."),
wf("wf02","wfa","The film was so ____ that I fell asleep.","BORE",["boring"],"-ing = co způsobuje pocit (boring), -ed = kdo ho má (bored)."),
wf("wf03","wfa","She spoke ____ about her experiences abroad.","HONEST",["honestly"],"Příslovce: přídavné jméno + -ly."),
wf("wf04","wfa","The ____ of the new law is still unclear.","IMPLEMENT",["implementation"],"Sloveso na -ate/-ment → podstatné jméno na -ation: implement → implementation."),
wf("wf05","wfa","It is ____ to predict the weather months ahead.","POSSIBLE",["impossible"],"Před p, b, m se používá im- (impossible, impatient, immature)."),
wf("wf06","wfa","He was ____ by the news of his friend's death.","DEVASTATE",["devastated"],"Pocit u osoby = -ed. Slovo končí na -e, přidá se jen -d."),
wf("wf07","wfa","The team achieved remarkable ____ in a short time.","SUCCEED",["success"],"succeed (sloveso) → success (podstatné jméno) → successful (přídavné jméno)."),
wf("wf08","wfa","His ____ behaviour got him fired.","RESPONSIBLE",["irresponsible"],"Před r se píše ir- (irregular, irrelevant, irresponsible)."),
wf("wf09","wfc","We need a more ____ way of heating the house, to save money.","ECONOMY",["economical"],"economical = úsporný, economic = hospodářský, ekonomický."),
wf("wf10","wfc","The country is facing a serious ____ crisis.","ECONOMY",["economic"],"economic = týkající se ekonomiky země. economical = úsporný."),
wf("wf11","wfa","Her ____ to the job was obvious to everyone.","COMMIT",["commitment"],"commit → commitment (bez zdvojeného t před -ment)."),
wf("wf12","wfa","The two paintings are almost ____.","DISTINGUISH",["indistinguishable"],"in- + distinguish + -able = nerozlišitelný."),
wf("wf13","wfa","You should show more ____ towards other people's feelings.","SENSITIVE",["sensitivity"],"-ive → -ivity (sensitive → sensitivity, creative → creativity)."),
wf("wf14","wfa","The plan was ____ because it would have cost far too much.","PRACTICE",["impractical","impracticable"],"Záporná předpona im- před p: impractical."),
wf("wf15","wfc","The signing of the treaty was a ____ moment for the whole country.","HISTORY",["historic"],"historic = významný, přelomový. historical = týkající se historie."),
wf("wf16","wfc","Archaeologists found ____ evidence that the town was founded in 1850.","HISTORY",["historical"],"historical = historický, týkající se minulosti. historic = přelomový."),
wf("wf17","wfa","The ____ of the staff was impressive.","PROFESSION",["professionalism"],"profession → professional → professionalism (chování, přístup)."),

/* Part 1 */
mc("mc01","col","Whether he gets the job will ultimately ____ down to how well he does at the interview.",["come","go","fall","turn"],0,"come down to = v konečném důsledku záležet na."),
mc("mc02","col","Few musicians manage to ____ it big.",["make","take","do","get"],0,"make it big = prorazit, mít velký úspěch."),
mc("mc03","col","He refused to ____ his back on his principles.",["put","turn","set","keep"],1,"turn your back on = otočit se zády, zradit."),
mc("mc04","col","The new law will come ____ force next month.",["to","into","in","on"],1,"come into force = vstoupit v platnost."),
mc("mc05","col","____ to popular belief, goldfish have good memories.",["Contrary","Opposite","In contrast","Against"],0,"contrary to = na rozdíl od (tomu, co se tvrdí). in contrast to by chtělo „to“ a jiný smysl."),
mc("mc06","col","The film is ____ on a true story.",["based","built","made","set"],0,"be based on = vycházet z."),
mc("mc07","col","I'm not very ____ on the idea of living abroad.",["keen","fond","interested","pleased"],0,"keen on, ale fond of, interested in, pleased with."),
mc("mc08","col","The company is currently ____ investigation for tax fraud.",["under","in","on","at"],0,"under investigation / pressure / suspicion."),
mc("mc09","col","We can't afford to ____ any chances with safety.",["make","take","do","have"],1,"take a chance / a risk."),
mc("mc10","col","I take ____ with your claim that the plan is cheap.",["issue","point","matter","debate"],0,"take issue with = nesouhlasit s."),
mc("mc11","col","The government is under increasing ____ to cut taxes.",["pressure","force","strain","stress"],0,"under pressure = pod tlakem."),
mc("mc12","col","The meeting has been ____ off until next week.",["put","called","set","taken"],0,"put off = odložit, call off = zrušit."),

/* ---- rozšíření: Part 4 ---- */

BANK.forEach(it => { if(it.ans) it.ansN = it.ans.map(norm); });
const BY_ID = Object.fromEntries(BANK.map(i=>[i.id,i]));

/* ---------- storage ---------- */
const KEY = "uoe-c1-v1";
const DAY = 864e5, INTERVALS = [0, DAY, 3*DAY, 7*DAY, 21*DAY];
const SEED_WEAK = ["inv","ded","wfc","link"];
function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && s.items) return s; }catch(e){} return {items:{},cats:{},log:[],days:[]}; }
let store = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }

function weak(cat){
  const c = store.cats[cat] || {seen:0, ok:0};
  const prior = SEED_WEAK.includes(cat) ? 0.4 : 0.65;
  return 1 - (c.ok + prior*4) / (c.seen + 4);
}
function todayStr(d=new Date()){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function streak(){
  const set = new Set(store.days); let n = 0; const d = new Date();
  if(!set.has(todayStr(d))) d.setDate(d.getDate()-1);
  while(set.has(todayStr(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}

/* ---------- session ---------- */
let view = "train", sess = null, partFilter = 0;

function buildSession(n=10){
  const now = Date.now();
  const pool = BANK.filter(it => !partFilter || it.part === partFilter);
  const due = pool.filter(it => store.items[it.id] && store.items[it.id].due <= now)
    .sort((a,b) => (store.items[a.id].box - store.items[b.id].box) || (weak(b.cat) - weak(a.cat)));
  let pick = due.slice(0, n);
  if(pick.length < n){
    const fresh = pool.filter(it => !store.items[it.id])
      .map(it => ({it, w: weak(it.cat) + Math.random()*0.35}))
      .sort((a,b) => b.w - a.w).map(x => x.it);
    pick = pick.concat(fresh.slice(0, n - pick.length));
  }
  if(pick.length < n){
    const rest = pool.filter(it => !pick.includes(it))
      .sort((a,b) => (store.items[a.id].box - store.items[b.id].box) || (Math.random() - .5));
    pick = pick.concat(rest.slice(0, n - pick.length));
  }
  return shuffle(pick);
}
function orderFor(it){ return it.type === "mc" ? shuffle(it.opts.map((_,i)=>i)) : null; }
function startSession(){
  const items = buildSession(10);
  sess = { queue: items.map(item => ({item, retry:false, order: orderFor(item)})), i:0, n: items.length, phase:"q", fb:null, results:[], hinted:false };
  renderTrain();
}

function record(it, ok, hinted, retry, given){
  const s = store.items[it.id] || (store.items[it.id] = {box:0, due:0, seen:0, ok:0});
  s.seen++; if(ok) s.ok++;
  if(!retry){
    const c = store.cats[it.cat] || (store.cats[it.cat] = {seen:0, ok:0});
    c.seen++; if(ok) c.ok++;
  }
  if(ok){ s.box = (!hinted && !retry) ? Math.min(4, s.box+1) : Math.max(s.box, 1); }
  else { s.box = 0; }
  s.due = Date.now() + INTERVALS[s.box];
  if(!ok && !retry){
    store.log.push({id: it.id, given: given == null ? "" : String(given), t: Date.now()});
    if(store.log.length > 40) store.log = store.log.slice(-40);
  }
  const t = todayStr(); if(!store.days.includes(t)){ store.days.push(t); if(store.days.length > 400) store.days = store.days.slice(-400); }
  save();
}

function submit(val, idk){
  const q = sess.queue[sess.i], it = q.item;
  let ok, given;
  if(it.type === "mc"){ given = idk ? null : val; ok = !idk && val === it.correct; }
  else { given = String(val || "").trim(); ok = !idk && given !== "" && it.ansN.includes(norm(given)); }
  record(it, ok, sess.hinted, q.retry, it.type==="mc" ? (given==null ? "" : it.opts[given]) : given);
  if(!q.retry) sess.results.push({it, ok, given});
  if(!ok && !q.retry){
    const pos = Math.min(sess.i + 4, sess.queue.length);
    sess.queue.splice(pos, 0, {item: it, retry:true, order: orderFor(it)});
  }
  sess.phase = "fb"; sess.fb = {given, ok, idk};
  renderTrain();
}
function next(){
  sess.i++; sess.phase = "q"; sess.fb = null; sess.hinted = false;
  renderTrain();
}

/* ---------- rendering: train ---------- */
function correctDisplay(it){ return it.type === "mc" ? it.opts[it.correct] : it.ans[0]; }
function filledText(it){
  const p = it.text.split("____");
  return esc(p[0]) + "<b>" + esc(correctDisplay(it)) + "</b>" + esc(p[1] || "");
}

function renderTrain(){
  const stage = $("#stage");
  if(!sess) return renderHome(stage);
  if(sess.i >= sess.queue.length) return renderDone(stage);
  const q = sess.queue[sess.i], it = q.item, fb = sess.phase === "fb" ? sess.fb : null;
  const done = sess.results.length;
  const pos = Math.min(done + (q.retry ? 0 : 1), sess.n);

  let inner;
  if(fb){
    if(fb.ok){
      inner = `<span class="filled ok">${esc(it.type==="mc" ? it.opts[it.correct] : fb.given)}</span>`;
    } else {
      const wrong = it.type==="mc" ? (fb.given==null ? "" : it.opts[fb.given]) : fb.given;
      inner = `<span class="filled bad"><s>${wrong ? esc(wrong) : "&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"}</s><b class="pen">${esc(correctDisplay(it))}</b></span>`;
    }
  } else if(it.type === "mc"){
    inner = `<span class="gap-blank"></span>`;
  } else {
    const w = Math.max(8, Math.max(...it.ans.map(a => a.length)) + 2);
    inner = `<input id="ans" class="gap-in" style="width:${w}ch" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Tvoje odpověď">`;
  }
  const parts = it.text.split("____");
  let html = `<section class="sheet">
    <div class="meta"><span>${PARTS[it.part]}</span><span>${q.retry ? '<span class="again">ještě jednou</span>' : pos + " / " + sess.n}</span></div>
    <div class="bar"><i style="width:${Math.round(done / sess.n * 100)}%"></i></div>`;
  if(it.type === "kt") html += `<p class="orig">${esc(it.a)}</p><p class="keyrow"><span class="keybox">${esc(it.key)}</span><span class="note">použij toto slovo beze změny, celkem 3 až 6 slov</span></p>`;
  html += `<p class="text">${esc(parts[0])}${inner}${esc(parts[1] || "")}${it.type==="wf" ? `<span class="keybox inline">${esc(it.key)}</span>` : ""}</p>`;

  if(it.type === "mc"){
    html += `<div class="opts">` + q.order.map((k,pos) => {
      let cls = "opt";
      if(fb){ if(k === it.correct) cls += " right"; else if(k === fb.given) cls += " wrong"; }
      return `<button class="${cls}" data-k="${k}" ${fb ? "disabled" : ""}><i>${"ABCD"[pos]}</i>${esc(it.opts[k])}</button>`;
    }).join("") + `</div>`;
  }
  if(!fb){
    html += `<div class="row">` +
      (it.type === "mc" ? "" : `<button class="btn primary" id="check">Zkontrolovat</button><button class="btn ghost" id="hint">Nápověda</button>`) +
      `<button class="btn ghost" id="idk">Nevím</button></div><p class="hint" id="hintTxt" aria-live="polite"></p>`;
  } else {
    const alts = it.ans && it.ans.length > 1 ? `<p class="alts">Uznává se i: ${it.ans.slice(1,3).map(esc).join(" · ")}</p>` : "";
    const verdict = fb.ok ? "Správně." : (q.retry ? "Znovu chyba, vrátí se v dalším kole." : "Chyba, vrátí se za pár úloh.");
    const last = sess.i === sess.queue.length - 1;
    html += `<div class="fb ${fb.ok ? "" : "bad"}"><p class="verdict">${verdict}</p><p class="why">${esc(it.why)}</p>${alts}</div>
      <div class="row"><button class="btn primary" id="next">${last ? "Dokončit" : "Dál"}</button></div>`;
  }
  html += `</section>`;
  stage.innerHTML = html;

  if(fb){ $("#next").focus(); $("#next").onclick = next; return; }
  if(it.type === "mc"){
    stage.querySelectorAll(".opt").forEach(b => b.onclick = () => submit(+b.dataset.k, false));
  } else {
    const inp = $("#ans");
    inp.focus();
    inp.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); if(inp.value.trim()) submit(inp.value, false); } });
    $("#check").onclick = () => { if(inp.value.trim()) submit(inp.value, false); else inp.focus(); };
    $("#hint").onclick = () => {
      sess.hinted = true;
      const a = it.ans[0], n = a.split(" ").length;
      $("#hintTxt").textContent = `Odpověď má ${n} ${plural(n)} a začíná na „${a[0].toLowerCase()}“.`;
      inp.focus();
    };
  }
  $("#idk").onclick = () => submit(null, true);
}

function renderHome(stage){
  const now = Date.now();
  const dueN = BANK.filter(it => store.items[it.id] && store.items[it.id].due <= now).length;
  const freshN = BANK.filter(it => !store.items[it.id]).length;
  const seenCats = Object.entries(store.cats).filter(([c,v]) => v.seen >= 3 && CATS[c])
    .sort((a,b) => (a[1].ok/a[1].seen) - (b[1].ok/b[1].seen));
  const weakLine = seenCats.length
    ? `Zatím nejslabší: ${esc(CATS[seenCats[0][0]])} (${seenCats[0][1].ok} z ${seenCats[0][1].seen} napoprvé).`
    : "Začneme tím, co ti nešlo: inverze, dedukce a záměnná slova.";
  stage.innerHTML = `<section class="sheet home">
    <p>Každé kolo má 10 úloh z celé zkoušky. Chyby se vrací ještě ve stejném kole a pak znovu dřív než zbytek, správné odpovědi se opakují po 1, 3, 7 a 21 dnech. Častěji ti vychází to, v čem chybuješ.</p>
    <div class="chips" role="group" aria-label="Část zkoušky">
      ${[[0,"Všechno"],[1,"Part 1"],[2,"Part 2"],[3,"Part 3"],[4,"Part 4"]].map(([k,l]) => `<button class="chip" data-p="${k}" aria-pressed="${partFilter === k}">${l}</button>`).join("")}
    </div>
    <button class="btn primary" id="start">Začít kolo</button>
    <p class="plan">${weakLine}<br>K opakování: ${dueN} · nových úloh: ${freshN}</p>
  </section>`;
  stage.querySelectorAll(".chip").forEach(c => c.onclick = () => { partFilter = +c.dataset.p; renderHome(stage); });
  $("#start").onclick = startSession;
}

function renderDone(stage){
  const first = sess.results;
  const okN = first.filter(r => r.ok).length;
  const errs = first.filter(r => !r.ok);
  stage.innerHTML = `<section class="sheet">
    <p class="score">${okN} z ${first.length} napoprvé</p>
    <p class="note" style="font-size:15px;margin:0">${errs.length ? "Chybné úlohy se vrátí hned v dalším kole." : "Čisté kolo. Příště dostaneš těžší a nové úlohy."}</p>
    ${errs.length ? `<ul class="errs">${errs.map(r => `<li>${filledText(r.it)}<br><span class="note">${esc(r.it.why)}</span></li>`).join("")}</ul>` : `<div style="height:18px"></div>`}
    <div class="row"><button class="btn primary" id="again">Další kolo</button><button class="btn ghost" id="toStats">Pokrok</button></div>
  </section>`;
  $("#again").onclick = startSession;
  $("#toStats").onclick = () => { sess = null; setView("stats"); };
}

/* ---------- rendering: stats ---------- */
let resetArmed = false;
function renderStats(stage){
  const items = Object.values(store.items);
  const seen = items.reduce((a,s) => a + s.seen, 0);
  const cats = Object.values(store.cats);
  const first = cats.reduce((a,c) => a + c.seen, 0), firstOk = cats.reduce((a,c) => a + c.ok, 0);
  const mastered = items.filter(s => s.box >= 3).length;
  const catRows = Object.keys(CATS).map(c => ({c, v: store.cats[c] || {seen:0, ok:0}}))
    .sort((a,b) => (a.v.seen ? a.v.ok/a.v.seen : 2) - (b.v.seen ? b.v.ok/b.v.seen : 2));
  const log = store.log.slice(-12).reverse().filter(l => BY_ID[l.id]);
  stage.innerHTML = `
    <div class="grid">
      <div class="stat"><b>${seen}</b><span>zodpovězeno</span></div>
      <div class="stat"><b>${first ? Math.round(firstOk/first*100) : 0} %</b><span>správně napoprvé</span></div>
      <div class="stat"><b>${mastered} / ${BANK.length}</b><span>zvládnuté úlohy</span></div>
      <div class="stat"><b>${streak()}</b><span>dní v řadě</span></div>
    </div>
    <h2>Podle témat</h2>
    <div class="cats">${catRows.map(({c,v}) => {
      const pct = v.seen ? Math.round(v.ok/v.seen*100) : 0;
      return `<div class="cat"><div class="top"><span>${esc(CATS[c])}</span><span>${v.seen ? v.ok + " z " + v.seen : "zatím nic"}</span></div><div class="track"><i class="${v.seen && pct < 60 ? "low" : ""}" style="width:${pct}%"></i></div></div>`;
    }).join("")}</div>
    <h2>Poslední chyby</h2>
    ${log.length ? `<ul class="errs">${log.map(l => { const it = BY_ID[l.id]; return `<li>${filledText(it)}${l.given ? `<br><span class="note">napsal jsi: <s>${esc(l.given)}</s></span>` : ""}</li>`; }).join("")}</ul>` : `<p class="note">Zatím žádné. Udělej první kolo.</p>`}
    <p><button class="link-btn" id="reset">${resetArmed ? "Opravdu smazat? Klikni znovu" : "Smazat postup"}</button></p>`;
  $("#reset").onclick = () => {
    if(!resetArmed){ resetArmed = true; renderStats(stage); return; }
    store = {items:{},cats:{},log:[],days:[]}; save(); resetArmed = false; sess = null; renderStats(stage);
  };
}

/* ---------- rendering: cheat sheet ---------- */
const CHEAT = [
 ["Inverze po záporných výrazech", `<p>Záporný nebo omezující výraz na začátku věty → pomocné sloveso před podmět. Bez pomocného slovesa se přidá do / does / did.</p>
  <ul><li><em>Not only does</em> it help, but … </li><li><em>Not until</em> I got home <em>did</em> I realise …</li><li><em>No sooner had</em> we sat down <em>than</em> …</li><li><em>Hardly / Scarcely had</em> we left <em>when</em> …</li><li><em>Never / Rarely / Seldom have</em> I seen …</li><li><em>Little did</em> he know …</li><li><em>Under no circumstances / On no account must</em> you …</li><li><em>Only when / Only after</em> … <em>did</em> I understand</li><li><em>Had</em> I known … / <em>Should</em> you need … / <em>Were</em> I you …</li></ul>`],
 ["Modály pro dedukci", `<ul><li><em>must have</em> + 3. tvar = určitě se stalo</li><li><em>can't / couldn't have</em> + 3. tvar = určitě se nestalo</li><li><em>might / may / could have</em> + 3. tvar = možná se stalo</li><li><em>bound to / sure to / certain to</em> + infinitiv = určitě se stane</li><li><em>is said / thought / believed to</em> + infinitiv · <em>to have</em> + 3. tvar pro dřívější děj</li></ul><p>V Part 4 piš <em>can't</em>, když je takhle zadané klíčové slovo. <em>cannot</em> a <em>can not</em> jsou jiná slova.</p>`],
 ["Wish, if only, would rather", `<ul><li><em>wish + minulý čas</em> = přání o přítomnosti (I wish I knew)</li><li><em>wish + had + 3. tvar</em> = lítost nad minulostí</li><li><em>wish + would</em> = stížnost na cizí chování (I wish he would stop)</li><li><em>would rather + podmět + minulý čas</em> = I'd rather you didn't</li><li><em>Had it not been for</em> = kdyby nebylo</li></ul>`],
 ["Záměnná slova v Part 3", `<ul><li><em>production</em> výroba · <em>productivity</em> výkonnost</li><li><em>economic</em> hospodářský · <em>economical</em> úsporný</li><li><em>historic</em> přelomový · <em>historical</em> historický</li><li><em>sensible</em> rozumný · <em>sensitive</em> citlivý</li><li><em>successful</em> úspěšný · <em>successive</em> po sobě jdoucí</li><li><em>comprehensive</em> obsáhlý · <em>comprehensible</em> srozumitelný</li><li><em>imaginary</em> vymyšlený · <em>imaginative</em> nápaditý</li></ul>`],
 ["Part 3: postup", `<ol style="padding-left:20px;margin:0 0 10px"><li>Urči, jaký slovní druh do mezery patří (podstatné jméno, přídavné jméno, příslovce, sloveso).</li><li>Zvaž, jestli věta nechce zápor. Před p, b, m je <em>im-</em>, před r <em>ir-</em>, před l <em>il-</em>, jinak <em>un-, in-, dis-</em>.</li><li>Podstatné jméno může být v množném čísle. Hledej <em>the</em> nebo <em>a</em> a slovesa v množném čísle.</li><li>Zkontroluj pravopis. Překlep bod nedá.</li></ol>`],
 ["Ustálené předložkové vazby", `<ul><li><em>insist on, apologise for, look forward to, be used to</em> + -ing</li><li><em>by no means, without a doubt, in spite of, on no account</em></li><li><em>take issue with, under pressure, come into force, put off</em></li></ul>`],
 ["Jak se body počítají", `<p>Part 1 a 2: 1 bod za mezeru. Part 3: 1 bod za slovo. Part 4: až 2 body za větu, po jednom za každou ze dvou správně zvládnutých částí. Slovo nesmíš měnit a pravopisná chyba stojí bod.</p>`],
];
function renderCheat(stage){
  stage.innerHTML = `<div class="cheat">${CHEAT.map(([t,b],i) => `<details ${i===0?"open":""}><summary>${esc(t)}</summary><div class="body">${b}</div></details>`).join("")}</div>`;
}

/* ---------- navigation ---------- */
function setView(v){
  view = v;
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.v === v)));
  const stage = $("#stage");
  if(v === "train") renderTrain();
  else if(v === "stats"){ resetArmed = false; renderStats(stage); }
  else renderCheat(stage);
}
document.querySelectorAll(".tab").forEach(t => t.onclick = () => setView(t.dataset.v));

document.addEventListener("keydown", e => {
  if(view !== "train" || !sess || sess.i >= sess.queue.length) return;
  if(e.target !== document.body) return;
  const it = sess.queue[sess.i].item;
  if(sess.phase === "fb" && e.key === "Enter"){ e.preventDefault(); next(); return; }
  if(sess.phase === "q" && it.type === "mc"){
    const k = "abcd".indexOf(e.key.toLowerCase());
    const n = "1234".indexOf(e.key);
    const idx = k >= 0 ? k : n;
    if(idx >= 0 && idx < it.opts.length) submit(sess.queue[sess.i].order[idx], false);
  }
});

setView("train");
</script>
</body>
</html>
